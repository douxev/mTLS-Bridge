[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MPL-2.0"
authors = ["Maelle <maelle@douxev.pro>"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Pas de strip ici : uniffi-bindgen lit la métadonnée dans .symtab.
# On strippera via `llvm-strip` après génération des bindings, dans le pipeline Gradle.
panic = "abort"

[profile.dev]
opt-level = 1
