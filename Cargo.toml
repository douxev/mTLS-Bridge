[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.83"
license = "MPL-2.0"
authors = ["Maelle <maelle@douxev.pro>"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# No strip here: uniffi-bindgen reads the metadata from .symtab.
# Stripping is done with `llvm-strip` after the bindings are generated, in the Gradle pipeline.
panic = "abort"

[profile.dev]
opt-level = 1
