[package]
name = "mtls-bridge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "mtls_bridge_core"
# rlib is required so that the integration tests in `tests/*.rs` can link
# against the core. cdylib = .so for Android. staticlib = native iOS libraries.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { version = "0.31", features = ["cli", "tokio"] }

# Multi-threaded runtime with 2 workers for the proxies (see src/runtime.rs):
# synchronous Kotlin callbacks (Keystore signing) must not block every
# connection. Two workers are enough to drive the forwarding.
tokio = { version = "1.43", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }

# TLS: rustls + aws-lc-rs (optimized ARM assembly, FIPS-friendly audit).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

# VPN mode: netstack-smoltcp turns the IP packets from the tun_fd into
# pseudo-native tokio::TcpStream values (impl AsyncRead+AsyncWrite). futures
# provides Stream/Sink (the input/output API of netstack-smoltcp).
netstack-smoltcp = "0.2"
futures = { version = "0.3", default-features = false, features = ["std"] }

thiserror = "2.0"
log = "0.4"

# Minimal HTTP/1.1 parsing to rewrite the Host header as requests pass through
# the bridge (reverse proxies such as Caddy/Nginx route by Host).
httparse = "1.9"

# tun_fd wrapper on Linux/Android: read/write syscalls through libc.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

# Logging to adb logcat (Android) or stderr (host), initialized once by the
# host through init_logging(), exported via uniffi.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.14", default-features = false }

[dev-dependencies]
tokio = { version = "1.43", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "test-util",
] }
# For the tests: an in-memory PKI (CA, server cert, client cert) is generated
# without depending on OpenSSL or on files on disk.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
env_logger = "0.11"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
