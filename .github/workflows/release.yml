name: Release

# Builds a signed release APK and attaches it to a GitHub Release when a
# version tag (v1.2.3) is pushed. Signing material comes from repository
# secrets; it is written to the runner's temp directory and never committed.
#
# Required secrets:
#   RELEASE_KEYSTORE_BASE64   base64 of the release keystore (.jks / PKCS12)
#   RELEASE_STORE_PASSWORD    keystore password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must match android/app/build.gradle.kts (ndkVersion, JVM target).
  NDK_VERSION: 27.2.12479018
  JAVA_VERSION: '21'

jobs:
  release-apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        working-directory: android
        env:
          MTLS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MTLS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          MTLS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MTLS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK and compute checksum
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="mtls-bridge-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "mTLS Bridge $GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtls-bridge-release-apk
          path: mtls-bridge-*.apk*
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
