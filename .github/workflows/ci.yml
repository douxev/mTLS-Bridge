name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'mTLS-Wrapper/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'mTLS-Wrapper/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: mTLS-Wrapper

jobs:
  rust-tests:
    name: Tests Rust (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mTLS-Wrapper

      - name: Build
        run: cargo build -p mtls-bridge-core

      - name: Tests d'intégration
        run: cargo test -p mtls-bridge-core --tests

      - name: Clippy (warnings = erreurs)
        run: cargo clippy -p mtls-bridge-core --tests -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  android-build:
    name: Build Android (4 ABIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mTLS-Wrapper

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2.12479018
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: mTLS-Wrapper/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mtls-bridge-debug-apk
          path: mTLS-Wrapper/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
