name: CI

# The project lives at the repository root (core/, android/, Cargo.toml…):
# no subdirectory to filter and no global working-directory.
on:
  push:
    branches: [main, master]
    paths:
      - 'core/**'
      - 'android/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'core/**'
      - 'android/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match android/app/build.gradle.kts (ndkVersion, compileOptions /
  # jvmTarget).
  NDK_VERSION: 27.2.12479018
  JAVA_VERSION: '21'

jobs:
  rust-tests:
    name: Rust tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p mtls-bridge-core

      - name: Tests (unit + integration)
        run: cargo test -p mtls-bridge-core --tests

      - name: Clippy (warnings = errors)
        run: cargo clippy -p mtls-bridge-core --tests -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  android-build:
    name: Android build + unit tests (3 ABIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ABIs = abiFilters / cargo-ndk -t in android/app/build.gradle.kts.
      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The runner image ships an Android SDK with its licenses accepted: use
      # its sdkmanager directly (android-actions/setup-android fails on the
      # image's extra add-on licenses).
      - name: Install NDK ${{ env.NDK_VERSION }}, platform 36 and build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      # ANDROID_NDK_HOME (read by cargo-ndk) is derived in the shell: the
      # runner's ANDROID_HOME variable is not necessarily in the `env`
      # context of expressions.
      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mtls-bridge-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Same job as the build: preBuild depends on the Rust compilation for
      # the 3 ABIs, which a separate job would have to redo entirely.
      - name: Android unit tests (JVM)
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:testDebugUnitTest --no-daemon
