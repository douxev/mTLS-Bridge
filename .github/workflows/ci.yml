name: CI

# Le dépôt est à la racine (core/, android/, Cargo.toml…) : pas de sous-dossier
# à filtrer ni de working-directory global.
on:
  push:
    branches: [main, master]
    paths:
      - 'core/**'
      - 'android/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'core/**'
      - 'android/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Doivent suivre android/app/build.gradle.kts (ndkVersion, compileOptions /
  # jvmTarget).
  NDK_VERSION: 27.2.12479018
  JAVA_VERSION: '21'

jobs:
  rust-tests:
    name: Tests Rust (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p mtls-bridge-core

      - name: Tests (unitaires + intégration)
        run: cargo test -p mtls-bridge-core --tests

      - name: Clippy (warnings = erreurs)
        run: cargo clippy -p mtls-bridge-core --tests -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  android-build:
    name: Build + tests unitaires Android (3 ABIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ABIs = abiFilters / cargo-ndk -t de android/app/build.gradle.kts.
      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      # ANDROID_NDK_HOME (lu par cargo-ndk) est dérivé dans le shell : la
      # variable ANDROID_HOME du runner n'est pas forcément dans le contexte
      # `env` des expressions.
      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mtls-bridge-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Même job que le build : preBuild dépend de la compilation Rust des
      # 3 ABIs, un job séparé la referait entièrement.
      - name: Tests unitaires Android (JVM)
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:testDebugUnitTest --no-daemon
