org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Disabled: our cargo-ndk / uniffi-bindgen Exec tasks do not serialize cleanly
# into the configuration cache. Re-enable if they move to typed tasks exposing
# their outputs via @OutputDirectory.
org.gradle.configuration-cache=false
# JDK 21 is required. If your default `java` is another version, set
# org.gradle.java.home in ~/.gradle/gradle.properties (machine-specific).
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
