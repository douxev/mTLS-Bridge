org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Désactivé : nos tâches Exec cargo-ndk / uniffi-bindgen ne sérialisent pas
# proprement dans le config-cache. À réactiver si on bascule sur des tâches
# typées exposant les sorties via @OutputDirectory.
org.gradle.configuration-cache=false
# Pinning JDK 21 : le `java` par défaut est JDK 25 EA, non supporté par AGP 8.7.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
