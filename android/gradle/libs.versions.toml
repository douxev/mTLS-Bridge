[versions]
# 8.10 = first AGP version supporting compileSdk 36 (Gradle 8.11.1 is enough).
agp = "8.10.1"
kotlin = "2.1.0"
composeBom = "2024.12.01"
material3 = "1.4.0-alpha04"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
lifecycleKtx = "2.8.7"
navigationCompose = "2.8.5"
datastore = "1.1.1"
biometric = "1.2.0-alpha05"
# biometric pulls an old androidx.fragment; >= 1.3 is required by the
# Activity Result APIs (lint InvalidFragmentVersionForActivityResult).
fragment = "1.8.5"
securityCrypto = "1.1.0-alpha06"
roomVersion = "2.6.1"
sqlcipher = "4.6.1"
ksp = "2.1.0-1.0.29"
# >= 5.16: the libjnidispatch.so files (including x86_64) are 16 KB aligned.
jna = "5.19.1"
# QR code for the remote configuration console (pure Java, no native library).
zxing = "3.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleKtx" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycleKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# Material3 expressive: use the 1.4 alpha, which contains the expressive composables
# (morphing Button shapes, FAB Menu, LoadingIndicator...). Stable expected during 2026.
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomVersion" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomVersion" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomVersion" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
